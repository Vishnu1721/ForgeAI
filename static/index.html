<!doctype html><html><meta charset=utf-8><meta name=viewport content='width=device-width'><title>ForgeAI</title><style>body{font:15px system-ui;background:#f3f5f8;color:#182638;margin:0}header{background:#14283e;color:white;padding:22px 5%;font-size:24px}main{max-width:1100px;margin:auto;padding:24px}section{background:white;padding:22px;border-radius:12px;margin-bottom:18px}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #ccd4df;border-radius:6px}button{background:#165d82;color:white;cursor:pointer;margin:3px}textarea{width:95%;height:90px}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #eee}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#526477}</style><header>ForgeAI · Industrial sales workspace</header><main><section><label>Demo role <select id=role onchange=load()><option>demo-sales</option><option>demo-manager</option><option>other-sales</option></select></label><p id=metrics></p></section><section><h2>Incoming RFQ</h2><select id=customer></select><p><textarea id=rfq>500 kg of Sodium chloride industrial grade; 200 L of Ethanol 99%</textarea></p><button onclick=create()>Process request</button><small>Demo parser: separate product lines with semicolons.</small></section><section><h2>Quotes</h2><div id=quotes></div></section><section><h2>Catalog & pricing</h2><div id=products></div></section><section><h2>Activity / simulated dispatch</h2><button onclick=inspect('audit')>Audit</button><button onclick=inspect('outbox')>Outbox</button><button onclick=inspect('orders')>Orders</button><pre id=detail></pre></section></main><script>
const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n/100);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,body){let r=await fetch('/api/'+path,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+$('role').value,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(JSON.stringify(j.detail));return j}async function run(f){try{await f()}catch(e){alert(e.message)}}async function load(){await run(async()=>{let [q,p,c]=await Promise.all(['quotes','products','customers'].map(x=>api(x)));$('customer').innerHTML=c.map(x=>`<option value=${esc(x.id)}>${esc(x.name)}</option>`).join('');$('metrics').textContent=`${q.length} quotes · ${money(q.reduce((s,x)=>s+x.total,0))} pipeline · ${q.filter(x=>x.status==='approval').length} awaiting approval`;$('quotes').innerHTML=q.map(x=>`<article><h3>${esc(x.id)} · ${money(x.total)} · ${esc(x.status)}</h3><p>${esc(x.text)}</p><pre>${esc(JSON.stringify(x.items,null,2))}</pre><p>${esc(x.issues.join('; '))}</p>${({review:['approve','reject'],approval:['approve','reject'],approved:['send','reject'],sent:['accept']}[x.status]||[]).map(a=>`<button onclick="act('${x.id}','${a}')">${a}</button>`).join('')}</article>`).join('')||'No quotes yet';$('products').innerHTML='<table><tr><th>SKU</th><th>Product</th><th>Cost</th><th>Stock</th><th>Actions</th></tr>'+p.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.name)}</td><td>${money(x.cost)}</td><td>${x.stock} ${esc(x.unit)}</td><td><button onclick="guide('${x.id}')">Guidance</button><button onclick="cost('${x.id}')">Reprice</button></td></tr>`).join('')+'</table>'})}async function create(){await run(async()=>{await api('rfq',{customer:$('customer').value,text:$('rfq').value,source_id:crypto.randomUUID()});await load()})}async function act(id,a){await run(async()=>{await api('quotes/'+id+'/'+a,{});await load()})}async function inspect(t){await run(async()=>{$('detail').textContent=JSON.stringify(await api(t),null,2)})}async function guide(id){await inspect('guidance/'+id)}async function cost(id){let n=prompt('New unit cost in cents');if(n)await run(async()=>{$('detail').textContent=JSON.stringify(await api('products/'+id+'/cost',{cost:Number(n)}),null,2);await load()})}load();</script></html>
