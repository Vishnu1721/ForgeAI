<!doctype html><html><meta charset=utf-8><meta name=viewport content='width=device-width'><title>ForgeAI</title><style>body{font:15px system-ui;background:#f3f5f8;color:#182638;margin:0}header{background:#14283e;color:white;padding:22px 5%;font-size:24px}main{max-width:1100px;margin:auto;padding:24px}section{background:white;padding:22px;border-radius:12px;margin-bottom:18px}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #ccd4df;border-radius:6px}button{background:#165d82;color:white;cursor:pointer;margin:3px}textarea{width:95%;height:90px}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #eee}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#526477}body{background:#eef2f6}header{position:sticky;top:0;z-index:2;font-weight:650}main{max-width:1200px}section{box-shadow:0 2px 8px #14283e0b;border:1px solid #e0e6ee}h2{font-size:20px;margin-top:0}article{border:1px solid #dce4ed;border-radius:10px;padding:18px;margin:14px 0;overflow-x:auto}article h3{margin-top:0}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}.kpi{background:#f3f6fa;padding:16px;border-radius:8px}.kpi strong{display:block;font-size:25px;margin-top:8px}.status{display:inline-block;background:#e4edf5;color:#234e70;padding:5px 10px;border-radius:20px;font-size:12px;text-transform:capitalize}.issue{color:#a04414}.nav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}.nav a{color:#165d82;text-decoration:none;font-weight:600}button:hover{background:#104665}button:disabled{opacity:.5;cursor:not-allowed}textarea{box-sizing:border-box;width:100%}th{font-size:12px;color:#526477;background:#f5f7fa}td{font-variant-numeric:tabular-nums} @media(max-width:650px){main{padding:12px}section{padding:12px;overflow-x:auto}}</style><header>ForgeAI · Industrial sales workspace</header><main><nav class="nav"><a href="#overview">Overview</a><a href="#intake">RFQ intake</a><a href="#workspace">Quotations</a><a href="#catalog">Catalog</a><a href="#activity">Activity</a></nav><section id="overview"><label>Demo role <select id=role onchange=load()><option>demo-sales</option><option>demo-manager</option><option>other-sales</option></select></label><div id=metrics class="kpis"></div></section><section id="intake"><h2>Incoming RFQ</h2><select id=customer></select><p><textarea id=rfq>500 kg of Sodium chloride industrial grade; 200 L of Ethanol 99%</textarea></p><button onclick=create()>Process request</button><small>Demo parser: separate product lines with semicolons.</small></section><section id="workspace"><h2>Quotes</h2><div id=quotes></div></section><section id="catalog"><h2>Catalog & pricing</h2><div id=products></div></section><section id="activity"><h2>Activity / simulated dispatch</h2><button onclick=inspect('audit')>Audit</button><button onclick=inspect('outbox')>Outbox</button><button onclick=inspect('orders')>Orders</button><pre id=detail></pre></section></main><script>
const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n/100);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,body){let r=await fetch('/api/'+path,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+$('role').value,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(JSON.stringify(j.detail));return j}async function run(f){try{await f()}catch(e){alert(e.message)}}async function load(){await run(async()=>{let [q,p,c]=await Promise.all(['quotes','products','customers'].map(x=>api(x)));$('customer').innerHTML=c.map(x=>`<option value=${esc(x.id)}>${esc(x.name)}</option>`).join('');$('metrics').innerHTML=[['Open pipeline',money(q.filter(x=>['review','approval','approved','sent'].includes(x.status)).reduce((s,x)=>s+x.total,0))],['Total quotes',q.length],['Manager approvals',q.filter(x=>x.status==='approval').length],['Orders',q.filter(x=>x.status==='ordered').length]].map(([k,v])=>`<div class="kpi"><small>${k}</small><strong>${v}</strong></div>`).join('');$('quotes').innerHTML=q.map(x=>`<article><h3>${esc(c.find(y=>y.id===x.customer)?.name||x.customer)} · ${money(x.total)} <span class="status">${esc(x.status)}</span></h3><p>${esc(x.text)}</p><small>Quote ${esc(x.id)}</small><table><thead><tr><th>SKU / Product</th><th>Quantity</th><th>Cost</th><th>Quoted total</th><th>Margin</th></tr></thead><tbody>${x.items.map(i=>`<tr><td><small>${esc(i.sku)}</small><br>${esc(i.name)}</td><td>${i.quantity} ${esc(i.unit)}</td><td>${money(i.cost)}</td><td>${money(i.total)}</td><td>${i.margin}%</td></tr>`).join("")}</tbody></table><p><strong>Gross profit: ${money(x.total-x.cost)}</strong> · Gross margin: ${x.total?((x.total-x.cost)/x.total*100).toFixed(2):"—"}%</p><p class="issue">${esc(x.issues.join("; "))}</p>${({review:['approve','reject'],approval:$('role').value==='demo-manager'?['approve','reject']:['reject'],approved:['send','reject'],sent:['accept']}[x.status]||[]).map(a=>`<button onclick="act('${x.id}','${a}')">${a}</button>`).join('')}</article>`).join('')||'No quotes yet';$('products').innerHTML='<table><tr><th>SKU</th><th>Product</th><th>Cost</th><th>Stock</th><th>Actions</th></tr>'+p.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.name)}</td><td>${money(x.cost)}</td><td>${x.stock} ${esc(x.unit)}</td><td><button onclick="guide('${x.id}')">Guidance</button><button onclick="cost('${x.id}')" ${$('role').value!=='demo-manager'?'disabled':''}>Reprice</button></td></tr>`).join('')+'</table>'})}async function create(){await run(async()=>{await api('rfq',{customer:$('customer').value,text:$('rfq').value,source_id:crypto.randomUUID()});await load()})}async function act(id,a){await run(async()=>{await api('quotes/'+id+'/'+a,{});await load()})}async function inspect(t){await run(async()=>{$('detail').textContent=JSON.stringify(await api(t),null,2)})}async function guide(id){await inspect('guidance/'+id)}async function cost(id){let n=prompt('New unit cost in cents');if(n)await run(async()=>{$('detail').textContent=JSON.stringify(await api('products/'+id+'/cost',{cost:Number(n)}),null,2);await load()})}load();</script></html>
